aid: open-mhealth
name: Open mHealth
description: >-
  Open mHealth is a nonprofit, community-driven initiative that develops open
  standards and open-source software for making patient-generated health data
  interoperable across mobile apps, wearables, clinical systems, and electronic
  health records. Its core contribution is a library of clinically validated
  JSON Schema data point schemas — covering physical activity, sleep, heart
  rate, blood pressure, body weight, blood glucose, and other vital signs —
  with the sleep, physical-activity, and metadata schemas now superseded by
  IEEE 1752.1, the IEEE standard for Mobile Health Data co-shepherded by the
  Open mHealth community. Around the schemas Open mHealth ships a stack of
  Apache-2.0 reference implementations: Shimmer (a Java/Spring server that
  pulls health data from Fitbit, Google Fit, iHealth, Misfit, RunKeeper, and
  Withings APIs and normalizes it into Open mHealth or IEEE 1752.1 data
  points), omh-dsu-ri (a Data Storage Unit reference implementation exposing
  an OAuth 2.0-secured Data Point REST API on top of MongoDB and PostgreSQL),
  Granola (an Objective-C library that serializes Apple HealthKit samples
  into Open mHealth JSON), a web visualizations library built on D3 and
  Plottable.js, the OMH-on-FHIR mapping that aligns Open mHealth data points
  to HL7 FHIR resources, and a sample-data-generator. Open mHealth operates
  as the steward of the standard, the schema and unit registry at
  registry.openmhealth.org, and a developer community of thousands of
  developers and health organizations including Cornell Tech, Kaiser
  Permanente, Stanford School of Medicine, UC Davis, and UCSF. The project
  has no commercial API, no paid tier, and no hosted SaaS — all artifacts
  are open source under Apache 2.0 and the standard itself is openly
  published.
